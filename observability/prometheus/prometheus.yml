global:
  scrape_interval: 15s

# Metrics are pushed by the OpenTelemetry Collector (OTLP) and Tempo (remote write): nothing to scrape.
scrape_configs: []

otlp:
  # Resource attributes kept as labels, on top of `job` (service.name) and `instance` (service.instance.id).
  promote_resource_attributes:
    - service.name
    - host.name
    - process.pid

storage:
  tsdb:
    # OTLP clients can send slightly out-of-order samples.
    out_of_order_time_window: 30m
