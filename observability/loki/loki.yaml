auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Keeps OTLP attributes such as `trace_id` and `span_id` to link logs to traces.
  allow_structured_metadata: true
  # Needed by Logs Drilldown.
  volume_enabled: true
  discover_log_levels: true

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
