# Local observability stack receiving the traces, metrics and logs of `atoti-sample`.
#
#   docker compose up -d
#
# - Grafana:                   http://localhost:3000 (anonymous admin, local use only)
# - OTLP endpoint (HTTP/gRPC): http://localhost:4318 / localhost:4317
# - Prometheus:                http://localhost:9091 (9090 is left to the Atoti session)
#
#   atoti-sample ──OTLP──▶ otel-collector ─┬─▶ Tempo (traces) ─────▶ Grafana
#                                          ├─▶ Prometheus (metrics) ▶ Grafana
#                                          └─▶ Loki (logs) ─────────▶ Grafana

name: atoti-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Metrics pushed by the collector over OTLP.
      - --web.enable-otlp-receiver
      # Service graph and span metrics generated by Tempo.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Drilldown apps to explore metrics, logs and traces without writing queries.
      GF_PLUGINS_PREINSTALL: grafana-metricsdrilldown-app,grafana-lokiexplore-app,grafana-exploretraces-app
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
